<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="icon" href="logo.jpg">

    <title>Consulta de pagos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <div >
     <img src="logo.jpg" alt="Logo" class="logo">
    </div>

    <h1>
        Consulta de días de pago
    </h1>

    <p class="subtitulo">
        Ingresa el No. DV para consultar la información
    </p>


  


    <!-- BUSCADOR -->

    <div class="buscador">

        <label for="buscarDV">
            No. DV
        </label>
<input

    id="buscarDV"
    placeholder="Escribe el No. DV..."
>

    <!-- RESULTADOS -->

    <div
        id="resultados"
        class="resultados"
    ></div>


    <!-- CLIENTE -->

    <section
        id="cliente"
        class="cliente oculto"
    ></section>


</main>


<script src="xlsx.full.min.js"></script>

</html>
